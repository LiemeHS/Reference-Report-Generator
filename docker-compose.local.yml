services:
  api:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - reference_gen2.api.phase7_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      REFERENCE_GEN2_PRODUCTION: "0"
      REFERENCE_GEN2_API_EXECUTION_BACKEND: sync
      REFERENCE_GEN2_LOCAL_DB_PATH: /data/db.sqlite
      REFERENCE_GEN2_REPORT_SERVING_TMP_DIR: /srv/reference_gen2/runtime/reports
      REFERENCE_GEN2_REPORT_SERVING_JOB_DIR: /srv/reference_gen2/runtime/jobs
      REFERENCE_GEN2_API_SECURITY_STATE_DB_PATH: /srv/reference_gen2/runtime/security/phase7.sqlite3
      REFERENCE_GEN2_UPLOAD_TMP_DIR: /srv/reference_gen2/runtime/uploads
      REFERENCE_GEN2_API_ALLOWED_HOSTS: "127.0.0.1,localhost"
      REFERENCE_GEN2_API_POST_ALLOWED_ORIGINS: "http://127.0.0.1:8000,http://localhost:8000"
      REFERENCE_GEN2_API_SESSION_COOKIE_SECURE: "0"
      REFERENCE_GEN2_API_ENABLE_SANITIZED_REPORT_ENDPOINT: "1"
      REFERENCE_GEN2_CORS_ALLOWED_ORIGINS: ""
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 1g
    cpus: 0.5
    volumes:
      - phase7_local_runtime:/srv/reference_gen2/runtime
      - ${REFERENCE_GEN2_LOCAL_DB_HOST_PATH:-./local_mock_refs.db}:/data/db.sqlite:ro

volumes:
  phase7_local_runtime:
