services:
  api:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - reference_gen2.api.phase7_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      REFERENCE_GEN2_PRODUCTION: "1"
      REFERENCE_GEN2_API_EXECUTION_BACKEND: worker
      REFERENCE_GEN2_LOCAL_DB_PATH: /data/db.sqlite
      REFERENCE_GEN2_REPORT_SERVING_TMP_DIR: /srv/reference_gen2/runtime/reports
      REFERENCE_GEN2_REPORT_SERVING_JOB_DIR: /srv/reference_gen2/runtime/jobs
      REFERENCE_GEN2_API_SECURITY_STATE_DB_PATH: /srv/reference_gen2/runtime/security/phase7.sqlite3
      REFERENCE_GEN2_UPLOAD_TMP_DIR: /srv/reference_gen2/runtime/uploads
      REFERENCE_GEN2_REPORT_SERVING_OWNERSHIP_SECRET: ${REFERENCE_GEN2_REPORT_SERVING_OWNERSHIP_SECRET}
      REFERENCE_GEN2_API_RATE_LIMIT_SECRET: ${REFERENCE_GEN2_API_RATE_LIMIT_SECRET}
      REFERENCE_GEN2_API_SESSION_COOKIE_SECURE: "1"
      REFERENCE_GEN2_API_ENABLE_SANITIZED_REPORT_ENDPOINT: "0"
      REFERENCE_GEN2_API_SUBMISSIONS_ENABLED: ${REFERENCE_GEN2_API_SUBMISSIONS_ENABLED:-1}
      REFERENCE_GEN2_API_ALLOWED_HOSTS: ${REFERENCE_GEN2_API_ALLOWED_HOSTS:-${APP_DOMAIN}}
      REFERENCE_GEN2_API_POST_ALLOWED_ORIGINS: ${REFERENCE_GEN2_API_POST_ALLOWED_ORIGINS:-https://${APP_DOMAIN}}
      REFERENCE_GEN2_API_TRUSTED_PROXY_CIDRS: ${REFERENCE_GEN2_API_TRUSTED_PROXY_CIDRS}
      REFERENCE_GEN2_SECURITY_SCAN_ENABLED: ${REFERENCE_GEN2_SECURITY_SCAN_ENABLED:-0}
      REFERENCE_GEN2_SECURITY_SCAN_EXECUTABLE: ${REFERENCE_GEN2_SECURITY_SCAN_EXECUTABLE:-}
      REFERENCE_GEN2_SECURITY_SCAN_ARGS: ${REFERENCE_GEN2_SECURITY_SCAN_ARGS:-}
      REFERENCE_GEN2_SECURITY_SCAN_TIMEOUT_SEC: ${REFERENCE_GEN2_SECURITY_SCAN_TIMEOUT_SEC:-15}
      REFERENCE_GEN2_SECURITY_SCAN_ACCEPT_RISK: ${REFERENCE_GEN2_SECURITY_SCAN_ACCEPT_RISK:-0}
      REFERENCE_GEN2_API_MAX_QUEUED_JOBS: ${REFERENCE_GEN2_API_MAX_QUEUED_JOBS:-20}
      REFERENCE_GEN2_API_NETWORK_BURST_WINDOW_SECONDS: ${REFERENCE_GEN2_API_NETWORK_BURST_WINDOW_SECONDS:-3600}
      REFERENCE_GEN2_API_NETWORK_BURST_MAX_REQUESTS: ${REFERENCE_GEN2_API_NETWORK_BURST_MAX_REQUESTS:-30}
      REFERENCE_GEN2_API_NETWORK_SUSTAINED_WINDOW_SECONDS: ${REFERENCE_GEN2_API_NETWORK_SUSTAINED_WINDOW_SECONDS:-28800}
      REFERENCE_GEN2_API_NETWORK_SUSTAINED_MAX_REQUESTS: ${REFERENCE_GEN2_API_NETWORK_SUSTAINED_MAX_REQUESTS:-120}
      REFERENCE_GEN2_API_GLOBAL_RATE_LIMIT_WINDOW_SECONDS: ${REFERENCE_GEN2_API_GLOBAL_RATE_LIMIT_WINDOW_SECONDS:-60}
      REFERENCE_GEN2_API_GLOBAL_RATE_LIMIT_MAX_REQUESTS: ${REFERENCE_GEN2_API_GLOBAL_RATE_LIMIT_MAX_REQUESTS:-300}
      REFERENCE_GEN2_API_CHALLENGE_MODE: ${REFERENCE_GEN2_API_CHALLENGE_MODE:-auto}
      REFERENCE_GEN2_API_CHALLENGE_MAX_NUMBER: ${REFERENCE_GEN2_API_CHALLENGE_MAX_NUMBER:-12000}
      REFERENCE_GEN2_API_CHALLENGE_TTL_SECONDS: ${REFERENCE_GEN2_API_CHALLENGE_TTL_SECONDS:-300}
      REFERENCE_GEN2_API_CHALLENGE_SOFT_LIMIT_RATIO: ${REFERENCE_GEN2_API_CHALLENGE_SOFT_LIMIT_RATIO:-0.75}
      REFERENCE_GEN2_API_CHALLENGE_QUEUE_RATIO: ${REFERENCE_GEN2_API_CHALLENGE_QUEUE_RATIO:-0.70}
      REFERENCE_GEN2_CORS_ALLOWED_ORIGINS: ""
    expose:
      - "8000"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 1g
    cpus: 0.5
    volumes:
      - phase7_runtime:/srv/reference_gen2/runtime
      - ${REFERENCE_GEN2_LOCAL_DB_HOST_PATH:-/data/db.sqlite}:/data/db.sqlite:ro
    depends_on:
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = (os.getenv('REFERENCE_GEN2_API_ALLOWED_HOSTS') or 'localhost').split(',')[0].strip() or 'localhost'; request = urllib.request.Request('http://127.0.0.1:8000/', headers={'Host': host}); urllib.request.urlopen(request, timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command:
      - python
      - -m
      - reference_gen2.api.phase7_worker
    environment:
      REFERENCE_GEN2_PRODUCTION: "1"
      REFERENCE_GEN2_LOCAL_DB_PATH: /data/db.sqlite
      REFERENCE_GEN2_REPORT_SERVING_TMP_DIR: /srv/reference_gen2/runtime/reports
      REFERENCE_GEN2_REPORT_SERVING_JOB_DIR: /srv/reference_gen2/runtime/jobs
      REFERENCE_GEN2_API_SECURITY_STATE_DB_PATH: /srv/reference_gen2/runtime/security/phase7.sqlite3
      REFERENCE_GEN2_UPLOAD_TMP_DIR: /srv/reference_gen2/runtime/uploads
      REFERENCE_GEN2_REPORT_SERVING_OWNERSHIP_SECRET: ${REFERENCE_GEN2_REPORT_SERVING_OWNERSHIP_SECRET}
      REFERENCE_GEN2_API_RATE_LIMIT_SECRET: ${REFERENCE_GEN2_API_RATE_LIMIT_SECRET}
      REFERENCE_GEN2_API_ALLOWED_HOSTS: ${REFERENCE_GEN2_API_ALLOWED_HOSTS:-${APP_DOMAIN}}
      REFERENCE_GEN2_API_POST_ALLOWED_ORIGINS: ${REFERENCE_GEN2_API_POST_ALLOWED_ORIGINS:-https://${APP_DOMAIN}}
      REFERENCE_GEN2_API_TRUSTED_PROXY_CIDRS: ${REFERENCE_GEN2_API_TRUSTED_PROXY_CIDRS}
      REFERENCE_GEN2_API_SUBMISSIONS_ENABLED: ${REFERENCE_GEN2_API_SUBMISSIONS_ENABLED:-1}
      REFERENCE_GEN2_SECURITY_SCAN_ENABLED: ${REFERENCE_GEN2_SECURITY_SCAN_ENABLED:-0}
      REFERENCE_GEN2_SECURITY_SCAN_EXECUTABLE: ${REFERENCE_GEN2_SECURITY_SCAN_EXECUTABLE:-}
      REFERENCE_GEN2_SECURITY_SCAN_ARGS: ${REFERENCE_GEN2_SECURITY_SCAN_ARGS:-}
      REFERENCE_GEN2_SECURITY_SCAN_TIMEOUT_SEC: ${REFERENCE_GEN2_SECURITY_SCAN_TIMEOUT_SEC:-15}
      REFERENCE_GEN2_SECURITY_SCAN_ACCEPT_RISK: ${REFERENCE_GEN2_SECURITY_SCAN_ACCEPT_RISK:-0}
      REFERENCE_GEN2_PHASE7_WORKER_POLL_SECONDS: ${REFERENCE_GEN2_PHASE7_WORKER_POLL_SECONDS:-2}
      REFERENCE_GEN2_PHASE7_WORKER_CONCURRENCY: ${REFERENCE_GEN2_PHASE7_WORKER_CONCURRENCY:-2}
      REFERENCE_GEN2_PHASE7_DB_WARMUP_ENABLED: ${REFERENCE_GEN2_PHASE7_DB_WARMUP_ENABLED:-0}
      REFERENCE_GEN2_PHASE7_DB_WARMUP_MAX_SECONDS: ${REFERENCE_GEN2_PHASE7_DB_WARMUP_MAX_SECONDS:-3}
      REFERENCE_GEN2_API_MAX_QUEUED_JOBS: ${REFERENCE_GEN2_API_MAX_QUEUED_JOBS:-20}
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 2g
    cpus: 0.75
    volumes:
      - phase7_runtime:/srv/reference_gen2/runtime
      - ${REFERENCE_GEN2_LOCAL_DB_HOST_PATH:-/data/db.sqlite}:/data/db.sqlite:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    networks:
      - edge
      - internal
    volumes:
      - ./docker/caddy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${REFERENCE_GEN2_INTERNAL_SUBNET:-172.28.0.0/24}

volumes:
  phase7_runtime:
  caddy_data:
  caddy_config:
